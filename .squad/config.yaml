version: 1
project:
  name: azm-crm
  primaryLanguage: typescript
  projectRoots:
    - .
tracker:
  type: jira
  workspace: azm-crm.atlassian.net
naming:
  includeTrackerId: true
  globalSequence: true
agents:
  - claude-code
planner:
  enabled: true
  provider: anthropic
  mode: auto
  auth:
    anthropic: subscription
  budget:
    maxFileReads: 25
    maxContextBytes: 50000
    maxDurationSeconds: 180
  cache:
    enabled: true
  maxOutputTokens: 16384
  stages:
    scout:
      enabled: true
      maxFiles: 12
      maxOutputTokens: 2048
  tools:
    grep: true
    listDir: true
    rangedRead: true
  validation:
    enabled: true
    strict: false
  runtime:
    anthropic: agent-sdk
  providerOptions:
    anthropic:
      thinking: adaptive
      effort: medium
      effortByPhase:
        scout: minimal
        draft: medium
